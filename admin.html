<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Personal Code</title>
<link rel="stylesheet" href="theme.css">
<style>body{font:16px/1.6 system-ui,sans-serif;color:var(--cream);margin:0;padding:28px 18px}main{max-width:760px;margin:0 auto}h1{font:500 2rem Georgia,serif;color:var(--gold)}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--cream)}button{cursor:pointer;background:var(--gold);color:var(--ink);border:0;padding:8px 14px;margin:6px 8px 0 0}button.g{background:none;color:var(--mute);border:1px solid var(--line)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.c.f{border-color:var(--gold)}.m{color:var(--mute);font-size:.85rem}.t{white-space:pre-wrap;margin:8px 0}</style></head>
<body><main><h1>Feedback inbox</h1><p id="s" class="m">Enter your admin key.</p>
<form id="l"><input id="k" type="password" placeholder="Admin key" autocomplete="current-password"> <button>Open</button></form><div id="o"></div></main>
<script>
const $=s=>document.querySelector(s);let K=sessionStorage.getItem('ak')||'';
const api=(m,b)=>fetch('/api/admin',{method:m,headers:{'x-admin-key':K,'content-type':'application/json'},body:b&&JSON.stringify(b)});
async function load(){const r=await api('GET');if(!r.ok){$('#s').textContent='Wrong key or not set up yet.';sessionStorage.removeItem('ak');return}
 sessionStorage.setItem('ak',K);$('#l').hidden=true;const d=await r.json();$('#s').textContent=d.length+' message(s). Featured: '+d.filter(x=>x.featured).length+' of 3.';
 $('#o').replaceChildren(...d.map(e=>{const c=document.createElement('div');c.className='c'+(e.featured?' f':'');
  const m=document.createElement('div');m.className='m';m.textContent=new Date(e.at).toLocaleString()+' · '+e.type+' · '+(e.name||'no name')+(e.email?' · '+e.email:'')+' · public OK: '+(e.consent?'yes':'no');
  const t=document.createElement('div');t.className='t';t.textContent=e.message;c.append(m,t);
  [['feature','Feature'],['unfeature','Unfeature'],['delete','Delete']].forEach(([a,l])=>{if((a=='feature'&&(e.featured||!e.consent))||(a=='unfeature'&&!e.featured))return;
   const b=document.createElement('button');b.textContent=l;if(a=='delete')b.className='g';b.onclick=async()=>{if(a=='delete'&&!confirm('Delete this message?'))return;const r=await api('POST',{id:e.id,action:a});if(!r.ok)alert((await r.json()).error);load()};c.append(b)});return c}))}
$('#l').onsubmit=e=>{e.preventDefault();K=$('#k').value;load()};if(K)load();
</script></body></html>
